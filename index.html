<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrrpt: Be a Voice. Not an Echo.</title>
  <meta name="description" content="Nine second voice notes stored for 9 days. That's it. That's the app.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700;900&family=Nunito:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #C27FC5;
      --yellow: #F2C200;
      --white:  #FFFFFF;
      --font-j: 'Jost', system-ui, sans-serif;
      --font-r: 'Arial Rounded MT Bold', 'Nunito', system-ui, sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: clip; }
    body { background: var(--bg); }
    a { text-decoration: none; color: inherit; }
    img { display: block; }

    /* coming soon toast */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a1a;
      color: #fff;
      font-family: var(--font-r);
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 100px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── TOP ── */
    .top {
      text-align: center;
      padding: 48px 24px 40px;
      position: relative;
      z-index: 2;
    }
    .logo { height: 52px; width: auto; margin: 0 auto 24px; filter: brightness(0) saturate(100%) invert(20%) sepia(85%) saturate(2000%) hue-rotate(300deg) brightness(65%); opacity: 0.65; }
    .tagline {
      font-family: var(--font-r);
      font-weight: 800;
      font-size: clamp(10px, 1vw, 15px);
      color: var(--white);
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .badges { display: flex; gap: 12px; justify-content: center; align-items: center; }
    .badge-apple { height: 40px; width: auto; }
    .badge-gp    { height: 40px; width: auto; }

    /* ── HERO ── */
    .hero {
      position: relative;
      min-height: 75vh;
      overflow: hidden;
    }

    /* machine: absolute floor, blends into bg */
    .machine {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(300px, 50vw, 700px);
      height: auto;
      mix-blend-mode: multiply;
      z-index: 1;
    }

    /* block 1: welcome + headline — sits over machine top */
    .copy-top {
      position: relative;
      z-index: 2;
      padding: 16px 2% 0 9%;
    }
    .welcome {
      font-family: var(--font-j);
      font-size: clamp(10px, 1vw, 14px);
      font-weight: 500;
      color: var(--yellow);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .headline {
      font-family: var(--font-j);
      font-size: clamp(13px, 3.3vw, 58px);
      font-weight: 900;
      color: var(--yellow);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      line-height: 1;
      text-align: left;
    }

    /* block 2: bottom copy — separate paragraph, sits over machine bottom */
    .copy-bottom {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-top: 22vw;
      padding-bottom: 48px;
    }
    .sub {
      font-family: var(--font-j);
      font-size: clamp(13px, 1.5vw, 20px);
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      line-height: 1.7;
    }
    .big {
      font-family: var(--font-j);
      font-size: clamp(22px, 3.5vw, 52px);
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .footer {
      position: fixed;
      bottom: 16px;
      right: 20px;
      display: flex;
      gap: 16px;
      z-index: 10;
    }
    .footer a {
      font-family: var(--font-j);
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .footer a:hover { color: rgba(255,255,255,0.9); }

    @media (max-width: 1100px) {
      .headline { font-size: clamp(18px, 3.1vw, 48px); letter-spacing: 0.14em; }
      .machine { width: 62vw; }
      .copy-bottom { margin-top: 28vw; }
    }
    @media (max-width: 768px) {
      .tagline { font-size: 10px; }
      .headline { font-size: clamp(16px, 5.5vw, 40px); letter-spacing: 0.1em; }
      .machine { width: 80vw; }
      .copy-bottom { margin-top: 44vw; }
    }
    @media (max-width: 480px) {
      .headline { font-size: clamp(14px, 6.5vw, 32px); letter-spacing: 0.06em; }
      .machine { width: 94vw; }
      .copy-bottom { margin-top: 52vw; }
    }
  </style>
</head>
<body>

  <div class="top">
    <img class="logo" src="chrrpt-logo.png" alt="Chrrpt">
    <p class="tagline">
      Nine second voice notes<br>
      stored for 9 days.<br>
      <br>
      That's it. That's the app.
    </p>
    <div class="badges">
      <a href="https://apps.apple.com/us/app/chrrpt/id1641163466" target="_blank">
        <img class="badge-apple"
          src="badges/Download-on-the-App-Store/US/Download_on_App_Store/Black_lockup/SVG/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.svg"
          alt="Download on the App Store">
      </a>
      <a href="#" onclick="showToast(); return false;">
        <img class="badge-gp"
          src="badges/Google Play Store Badge.png"
          alt="Get it on Google Play">
      </a>
    </div>
  </div>

  <div class="hero">

    <div class="copy-top">
      <p class="welcome">Welcome to</p>
      <h1 class="headline">The Internet's Answering Machine</h1>
    </div>

    <div class="copy-bottom">
      <p class="sub">Because life is meant to be lived<br>out loud</p>
      <p class="big">It's time to be heard</p>
    </div>

    <img class="machine" src="phonemate400.png" alt="Phone-Mate 400">

  </div>

  <footer class="footer">
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
  </footer>

  <div class="toast" id="toast">Android coming soon 🤙</div>

  <script>
    function showToast() {
      const t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
  </script>

</body>
</html>
