<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrrpt</title>
  <meta name="description" content="Add this person on Chrrpt — voice messaging built for people who actually have something to say.">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root {
      --rich-black: #0D1117;
      --yellow:     #FFCC4F;
      --ink-dim:    rgba(255,255,255,0.35);
      --ink-faint:  rgba(255,255,255,0.12);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100dvh;
      overflow-x: clip;
    }

    body {
      background: linear-gradient(150deg, #FF85C1 0%, #FFE4D6 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 40px 80px;
      gap: 0;
    }

    /* ── Card ── */
    .card {
      background: var(--rich-black);
      border-radius: 24px;
      width: 340px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.28), 0 4px 16px rgba(0,0,0,0.16);
    }

    .card-header {
      padding: 24px 24px 20px;
      border-bottom: 1px solid var(--ink-faint);
    }

    .wordmark img {
      height: 40px;
      width: auto;
      display: block;
    }

    .card-body {
      padding: 24px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
    }

    /* ── Profile card (matches Settings tab style) ── */
    .profile-card {
      background: #0A1045;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      position: relative;
      min-height: 110px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .color-dot {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .nickname {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.5px;
      line-height: 1;
      text-transform: uppercase;
      flex: 1;
    }

    .profile-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .chrrpt-id {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      font-weight: 500;
    }

    .emoji {
      font-size: 28px;
      line-height: 1;
    }

    /* ── QR ── */
    .qr-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .qr-box {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      display: inline-flex;
    }

    .qr-hint {
      font-size: 12px;
      color: var(--ink-dim);
      letter-spacing: 0.3px;
    }

    /* ── States ── */
    .state-msg {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-dim);
      font-size: 14px;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      body {
        justify-content: center;
        padding: 32px 20px;
      }

      .card { width: 100%; max-width: 380px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="wordmark"><img src="/chrrpt-logo.png" alt="Chrrpt"></div>
    </div>
    <div class="card-body" id="card-body">
      <div class="state-msg">Loading…</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL      = 'https://ykwtxdxznemgwjifkcyg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlrd3R4ZHh6bmVtZ3dqaWZrY3lnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM1NDIzMTQsImV4cCI6MjA1OTExODMxNH0.Qy4es_hYJMIXn0KirUy9VpK1N5ZnLSiDRQyVV2yaUvM';

    const COLOR_MAP = {
      pink:   '#CC0093',
      yellow: '#FFCC4F',
      blue:   '#004BCC',
      orange: '#FF6B00',
      black:  '#1a1a1a',
      red:    '#FF3B30',
    };

    const raw = window.location.pathname.replace(/^\//, '').split('/')[0];
    const chrrptId = parseInt(raw, 10);

    async function load() {
      const body = document.getElementById('card-body');

      if (!chrrptId || isNaN(chrrptId)) {
        document.title = 'Chrrpt';
        body.innerHTML = '<div class="state-msg">No profile here.</div>';
        return;
      }

      const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const { data, error } = await client
        .from('profiles')
        .select('display_name, color, emoji, chrrpt_id')
        .eq('chrrpt_id', chrrptId)
        .single();

      if (error || !data) {
        body.innerHTML = `<div class="state-msg" style="font-size:11px;text-align:left;padding:16px;">ERR: ${JSON.stringify(error)}<br>ID: ${chrrptId}</div>`;
        return;
      }

      const hex      = COLOR_MAP[data.color] ?? '#CC0093';
      const id       = String(data.chrrpt_id).padStart(3, '0');
      const deepLink = `chrrpt://add/${data.chrrpt_id}`;
      const nickname = data.display_name || 'Unknown';
      const emoji    = data.emoji        || '';

      document.title = `${nickname} · Chrrpt`;

      body.innerHTML = `
        <div class="profile-card">
          <div class="profile-top">
            <div class="color-dot" style="background:${hex}"></div>
            <div class="nickname">${nickname}</div>
          </div>
          <div class="profile-bottom">
            <span class="chrrpt-id">ChrrptID : ${id}</span>
            ${emoji ? `<span class="emoji">${emoji}</span>` : ''}
          </div>
        </div>
        <div class="qr-wrap">
          <div class="qr-box"><canvas id="qr"></canvas></div>
          <span class="qr-hint">Scan with Chrrpt to add</span>
        </div>
      `;

      QRCode.toCanvas(document.getElementById('qr'), deepLink, {
        width: 200,
        margin: 0,
        color: { dark: '#0D1117', light: '#ffffff' },
      });
    }

    load();
  </script>

</body>
</html>
