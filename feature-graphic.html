<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024">
  <title>Chrrpt — Feature Graphic</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1024px; height: 500px; overflow: hidden; background: #642B73; }

    .wrap {
      width: 1024px;
      height: 500px;
      background: linear-gradient(135deg, #642B73 0%, #8B3A8A 40%, #C6426E 100%);
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .phone {
      position: absolute;
      right: -30px;
      bottom: -20px;
      height: 560px;
      width: auto;
      mix-blend-mode: multiply;
      opacity: 0.85;
    }

    .left {
      position: relative;
      z-index: 2;
      padding-left: 72px;
      max-width: 580px;
    }

    .logo {
      height: 36px;
      width: auto;
      margin-bottom: 24px;
      filter: brightness(0) saturate(100%) invert(30%) sepia(90%) saturate(2200%) hue-rotate(318deg) brightness(85%);
      opacity: 0.4;
    }

    .label {
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 16px;
    }

    .headline {
      font-family: 'Jost', sans-serif;
      font-size: 62px;
      font-weight: 900;
      color: #F2C200;
      line-height: 1;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .sub {
      font-family: 'Jost', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <img class="logo" src="chrrpt-logo.png" alt="Chrrpt">
      <p class="label">Voice First · Friends Only</p>
      <h1 class="headline">The Internet's<br>Answering Machine.</h1>
      <p class="sub">9 seconds &nbsp;·&nbsp; 9 days &nbsp;·&nbsp; Gone.</p>
    </div>
    <img class="phone" src="phonemate400.png" alt="">
  </div>
</body>
</html>
